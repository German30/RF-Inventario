name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios + lint + APK de debug
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Reportes de tests y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Publicar APK de debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rf-inventario-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
